services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: lifeledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifeledger}
      POSTGRES_DB: lifeledger
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql          # postgres:18 keeps data under /var/lib/postgresql/18/
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U lifeledger"], interval: 5s, retries: 10 }

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://lifeledger:${POSTGRES_PASSWORD:-lifeledger}@postgres:5432/lifeledger"
    extra_hosts: ["host.docker.internal:host-gateway"]
    user: "1000:1000"
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://lifeledger:${POSTGRES_PASSWORD:-lifeledger}@postgres:5432/lifeledger"
    extra_hosts: ["host.docker.internal:host-gateway"]
    user: "1000:1000"
    restart: unless-stopped
    command: uvicorn --factory app.api.main:app_factory --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  processor:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://lifeledger:${POSTGRES_PASSWORD:-lifeledger}@postgres:5432/lifeledger"
    extra_hosts: ["host.docker.internal:host-gateway"]
    user: "1000:1000"
    restart: unless-stopped
    command: python -m app.pipeline.main
    volumes:
      - ./data/inbox:/data/inbox
      - ./data/outbox:/data/outbox
    depends_on:
      migrate:
        condition: service_completed_successfully

  mail-fetcher:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://lifeledger:${POSTGRES_PASSWORD:-lifeledger}@postgres:5432/lifeledger"
    extra_hosts: ["host.docker.internal:host-gateway"]
    user: "1000:1000"
    restart: unless-stopped
    command: python -m app.mail.main
    volumes:
      - ./secrets:/srv/secrets
      - ./data/inbox:/data/inbox
    depends_on:
      migrate:
        condition: service_completed_successfully

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://lifeledger:${POSTGRES_PASSWORD:-lifeledger}@postgres:5432/lifeledger"
    extra_hosts: ["host.docker.internal:host-gateway"]
    user: "1000:1000"
    restart: unless-stopped
    command: python -m app.bot.main
    volumes:
      - ./data/inbox:/data/inbox
    depends_on:
      migrate:
        condition: service_completed_successfully

  parser:
    build: { context: ., dockerfile: Dockerfile.parser }
    environment:
      PDF_PASSWORDS: "${PDF_PASSWORDS:-[]}"
    network_mode: none
    read_only: true
    tmpfs: ["/tmp"]
    user: "1000:1000"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    cpus: "2"
    mem_limit: 2g
    pids_limit: 200
    volumes:
      - ./data/inbox:/data/inbox:ro
      - ./data/outbox:/data/outbox
    restart: unless-stopped

  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports: ["127.0.0.1:8233:8233"]
    volumes: ["temporal-data:/data"]
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://lifeledger:${POSTGRES_PASSWORD:-lifeledger}@postgres:5432/lifeledger"
      TEMPORAL_ADDRESS: "temporal:7233"
    extra_hosts: ["host.docker.internal:host-gateway"]
    user: "1000:1000"
    restart: unless-stopped
    command: python -m app.workflows.worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_started

volumes:
  pgdata: {}
  temporal-data: {}
